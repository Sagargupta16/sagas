name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only; the deploy job elevates only what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so per-chapter writing dates build
      # No package-manager input: the action detects pnpm from pnpm-lock.yaml and
      # pnpm/action-setup reads the version from package.json's packageManager,
      # which Renovate keeps current. A pinned input here drifted from it and
      # failed the build with "Multiple versions of pnpm specified".
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
